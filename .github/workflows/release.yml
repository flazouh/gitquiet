name: Release

on:
  release:
    types: [published]

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set extension version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "EXTENSION_VERSION=$(bun scripts/release-version.ts "$RELEASE_TAG")" >> "$GITHUB_ENV"

      - name: Build extension
        run: bun run build

      - name: Package extension
        run: bun run zip

      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" .output/*-chrome.zip --clobber

      - name: Submit to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: bunx wxt submit --chrome-zip .output/*-chrome.zip
