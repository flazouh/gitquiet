name: Release

# Builds the tag once, attaches what it built to the GitHub release, then hands
# the same bytes to a job per target. One job per target because a store that is
# down, or a review queue that rejects a package, is a thing to re-run on its
# own — "Re-run failed jobs" then talks to that one and no other.
#
# Every target is skipped rather than failed when nobody has given this workflow
# the credentials for it, which is what lets a release work before all of them
# are set up: adding a store is adding its secrets. `gate` below is where that is
# decided, once, so the answer shows in the run as a skipped job rather than as a
# green one that quietly did nothing.
on:
  release:
    types: [published]
  # `tag.yml` calls this after it writes a tag. A release opened by the workflow
  # token raises no `published` event, by design, so the caller says which tag.
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and submit
        required: true
        type: string
      # The release page `tag.yml` just opened is empty, so fill it.
      attach:
        description: Attach the packages to the GitHub release
        default: true
        type: boolean
  # The same thing by hand, for a tag that already exists.
  #
  #   gh workflow run release.yml -f tag=v0.2.2 -f targets=chrome
  #
  # "Re-run failed jobs" reruns the workflow the run started with, so it cannot
  # carry a fix to the workflow itself. Without this, a broken step means cutting
  # a version nobody asked for to get the one that was already tagged submitted.
  #
  # `targets` because the reason to come back to a published tag is that one store
  # did not take it, and sending it to the others again is not harmless: a store
  # refuses a version it already holds, so the run would go red on a release that
  # worked, and both mac jobs would notarise for an hour to attach what is already
  # attached.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and submit
        required: true
        type: string
      targets:
        description: Which targets to submit
        default: all
        type: choice
        options: [all, chrome, firefox, desktop, safari]
      # Off here, because a dispatch comes back to a page that is already filled,
      # and replacing an asset would swap the exact bytes a store is reviewing for
      # a fresh build of the same commit. The two are not promised to be identical.
      attach:
        description: Attach the packages to the GitHub release
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    name: Read which targets are configured
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      chrome: ${{ steps.which.outputs.chrome }}
      firefox: ${{ steps.which.outputs.firefox }}
      desktop: ${{ steps.which.outputs.desktop }}
      safari: ${{ steps.which.outputs.safari }}
    steps:
      # No checkout: this reads the event and the secrets, and nothing else.
      # A `secrets` value cannot be read in a job's own `if`, which is the whole
      # reason this job exists rather than a condition on each of the others.
      - name: Read the tag and the credentials
        id: which
        env:
          CALLED: ${{ inputs.tag }}
          PUBLISHED: ${{ github.event.release.tag_name }}
          # Only a hand-run dispatch sets this. Everything else means all of them.
          TARGETS: ${{ inputs.targets }}
          # The credential each target cannot work without, rather than its id.
          # An extension id is public, so gating on one would call a store
          # configured while it is still missing the key that talks to it, and
          # turn a skipped job into a failed release.
          CHROME: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX: ${{ secrets.FIREFOX_JWT_SECRET }}
          # Apple takes two, because both mac jobs sign and then notarize, and
          # an unnotarised build is one Gatekeeper refuses. With the certificate
          # alone they would start and die at `notarytool`.
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_NOTARY: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          tag="${CALLED:-$PUBLISHED}"
          if [ -z "$tag" ]; then
            echo "::error::No tag to release."
            exit 1
          fi
          # Yes when this run asked for the target and every credential it needs
          # is set. Both mac jobs answer to the same two, and are asked
          # separately because a store that refused a tag is asked for it again
          # on its own.
          ready() {
            target=$1
            shift
            case "${TARGETS:-all}" in all | "$target") ;; *)
              echo no
              return
              ;;
            esac
            for one in "$@"; do [ -n "$one" ] || {
              echo no
              return
            }; done
            echo yes
          }
          {
            echo "tag=$tag"
            echo "chrome=$(ready chrome "$CHROME")"
            echo "firefox=$(ready firefox "$FIREFOX")"
            echo "desktop=$(ready desktop "$APPLE_CERTIFICATE" "$APPLE_NOTARY")"
            echo "safari=$(ready safari "$APPLE_CERTIFICATE" "$APPLE_NOTARY")"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Build and attach
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to the commit rather than the tag, because a tag can be moved to
      # point at other code, and these jobs hold the store credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.tag }}

      # `.bun-version`, the same as `ci.yml`. On `latest` the build that ships is
      # not the build that went green, and the difference only shows after the tag
      # is published.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set the release version
        env:
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: echo "RELEASE_VERSION=$(bun scripts/release-version.ts "$RELEASE_TAG")" >> "$GITHUB_ENV"

      # The install skips the `prepare` script, which is what writes
      # `.wxt/tsconfig.json` locally. Every chunk the build makes is bundled
      # through vite, and vite reads that file, so without this the first of them
      # fails on "Tsconfig not found" before `wxt build` is reached. `ci.yml` runs
      # the same step for the same reason.
      - name: Generate WXT types
        run: bun run types

      # Once. Both packages are the same interface; what differs is the manifest
      # each store reads, and the chunks under `public` that the scripts in this
      # step write are shared by both.
      - name: Build extension
        run: bun run build

      - name: Package for Chrome
        run: bun run zip

      # Also writes the sources zip, which Firefox asks for next to the package
      # because a reviewer has to rebuild a bundle to see what is in it.
      - name: Package for Firefox
        run: bun run zip:firefox

      # Whoever started this run says so, rather than this reading the event.
      #
      # `github.event_name` is the caller's event inside a called workflow, and
      # `tag.yml` is itself a dispatch, so a run through it is indistinguishable
      # here from a hand-run one. Reading the event cost v0.2.4 its three zips:
      # the stores took the right bytes, and the release page offered only the two
      # disk images, which came from jobs that do not ask.
      #
      # A release published by hand in the GitHub UI passes no inputs at all, and
      # its page is as empty as the one `tag.yml` opens.
      #
      # The step decides in the shell rather than in `if:`, so that a run which
      # attaches nothing says which page it left alone and why. A skipped step
      # says nothing at all, which is how the missing zips got as far as a
      # published release.
      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          ATTACH: ${{ inputs.attach || github.event_name == 'release' }}
        run: |
          if [ "$ATTACH" != "true" ]; then
            echo "Leaving the page of $RELEASE_TAG as it is: this run came back to a tag that already has one. Pass attach=true to replace what it holds."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" .output/*.zip --clobber
          echo "The page of $RELEASE_TAG now holds:"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | "  \(.name)"'

      # The store jobs below build nothing. They take exactly these bytes, so
      # what a store reviews is what the release page offers to download.
      #
      # `include-hidden-files` because WXT writes to `.output`, and this action
      # has skipped anything under a dotted path since v4.4 unless told not to.
      # It does not fail on the exclusion, it reports finding no file matching a
      # path the build had just written, which reads as a build that produced
      # nothing.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: .output/*.zip
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  chrome:
    name: Chrome Web Store
    needs: [gate, package]
    if: needs.gate.outputs.chrome == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: .output

      - name: Submit to the Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: bunx wxt submit --chrome-zip .output/*-chrome.zip

  firefox:
    name: Firefox Add-ons
    needs: [gate, package]
    if: needs.gate.outputs.firefox == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: .output

      # `listed` is the public directory. The sources zip goes up with the
      # package, because everything a reader runs here was bundled and a reviewer
      # is owed the input rather than the output.
      - name: Submit to Firefox Add-ons
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: listed
        run: |
          bunx wxt submit \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip

  desktop:
    name: macOS app
    needs: [gate, package]
    # Gatekeeper refuses an unsigned app that arrived over the network, so a DMG
    # nobody can open is worse than no DMG at all.
    if: needs.gate.outputs.desktop == 'yes'
    # An Apple app can only be signed and notarised on a Mac, and `hdiutil`,
    # `codesign` and `notarytool` are all only here.
    runs-on: macos-latest
    # Notarisation is a queue at Apple. Ten minutes is normal, an hour happens.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set the release version
        env:
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: echo "RELEASE_VERSION=$(bun scripts/release-version.ts "$RELEASE_TAG")" >> "$GITHUB_ENV"

      # The window builds the same screens the extension does, so it goes through
      # the same rolldown, which reads `.wxt/tsconfig.json`. `--ignore-scripts`
      # above skips the hook that would have written it, and the failure names a
      # missing tsconfig rather than a missing step.
      - name: Generate WXT types
        run: bun run types

      - uses: ./.github/actions/apple-keychain
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      # `ELECTROBUN_DEVELOPER_ID` is what turns signing on: see
      # desktop/electrobun.config.ts, which reads it to decide.
      - name: Build, sign and notarise
        working-directory: desktop
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          ELECTROBUN_APPLEID: ${{ secrets.APPLE_ID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.APPLE_ID_PASSWORD }}
          ELECTROBUN_TEAMID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run build:stable

      # Renamed on the way up. Electrobun names an artifact for the build it came
      # from, which reads as nothing at all in somebody's downloads folder.
      - name: Name the disk image for what it is
        run: |
          echo "DMG=GitQuiet-$RELEASE_VERSION-macos-arm64.dmg" >> "$GITHUB_ENV"
          mv desktop/artifacts/*-GitQuiet.dmg "GitQuiet-$RELEASE_VERSION-macos-arm64.dmg"

      - uses: ./.github/actions/gatekeeper
        with:
          dmg: ${{ env.DMG }}

      # Twice, under two names.
      #
      # The versioned one is what somebody ends up with in their downloads
      # folder, where `GitQuiet.dmg` says nothing about which build it is. The
      # second is a fixed name, because `releases/latest/download/NAME` is the
      # only link to a release asset that survives the next release, and it
      # resolves a name and not a pattern. That link is the download button on
      # gitquiet.com, so without it the site has to be edited on every release
      # and is wrong in between.
      - name: Attach the app to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: |
          cp "$DMG" GitQuiet-macos-arm64.dmg
          gh release upload "$RELEASE_TAG" "$DMG" GitQuiet-macos-arm64.dmg --clobber

  safari:
    name: Safari app
    needs: [gate, package]
    if: needs.gate.outputs.safari == 'yes'
    # Safari's own requirement: an extension it will load is one inside a macOS
    # app, and only Xcode builds those.
    runs-on: macos-latest
    timeout-minutes: 90
    # The app's name, which is also its folder, its project, its scheme and its
    # bundle. Written once here rather than eight times below, where one of the
    # eight would eventually be missed.
    env:
      APP: GitQuiet for Safari
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set the release version
        env:
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: echo "RELEASE_VERSION=$(bun scripts/release-version.ts "$RELEASE_TAG")" >> "$GITHUB_ENV"

      - name: Generate WXT types
        run: bun run types

      # `bun run build` first, because the scripts in it write the chunks under
      # `public` that every target imports, and only then the Safari manifest.
      - name: Build the extension for Safari
        run: |
          bun run build
          bun run build:safari

      - uses: ./.github/actions/apple-keychain
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      # Generated on every release and committed nowhere, so the project cannot
      # describe an older extension than the one built beside it.
      #
      # The identifier's last part has to be the app's name with the spaces turned
      # into hyphens, because the converter writes two identifiers and derives them
      # differently: the app's from the name it was given, the extension's from the
      # identifier it was given plus `.Extension`. Where the two disagree, Xcode
      # refuses the pair with "not prefixed with the parent app's bundle
      # identifier", and the disagreement is silent until then. `GitQuiet` with
      # `dev.gitquiet.safari` failed this way, and so did `GitQuiet for Safari`
      # with `dev.gitquiet.GitQuiet`.
      #
      # Named apart from the desktop app, which is also GitQuiet and also lands in
      # Applications. Two files of that name cannot both sit there, so installing
      # the second used to replace the first, and Spotlight offered two identical
      # answers up to the moment it did.
      - name: Wrap the extension in an Xcode project
        run: |
          xcrun safari-web-extension-converter .output/safari-mv3 \
            --project-location "$RUNNER_TEMP/safari" \
            --app-name "$APP" \
            --bundle-identifier "dev.gitquiet.${APP// /-}" \
            --macos-only --swift --copy-resources --no-open --no-prompt --force

      # Archive and export, rather than signing the app once it is built. The
      # extension is a bundle inside a bundle, and this is what signs both from
      # the inside out and turns the hardened runtime on, which notarising needs.
      #
      # The two versions are passed in because the converter writes `1.0` and
      # build `1` into the project it generates, and nothing downstream corrects
      # it. Every Safari app released so far says `1.0` inside while its disk image
      # is named for the tag. Xcode applies these to the app and the extension
      # together, which is what Safari reads and what the App Store counts on:
      # it refuses an upload whose build number did not go up.
      #
      # The category is passed in for the same reason: the converter leaves it out,
      # the build warns about it, and the App Store rejects an app without one.
      - name: Archive and sign
        env:
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          plist="$RUNNER_TEMP/export.plist"
          plutil -create xml1 "$plist"
          plutil -insert method -string developer-id "$plist"
          plutil -insert teamID -string "$TEAM" "$plist"
          plutil -insert signingStyle -string manual "$plist"
          plutil -insert signingCertificate -string "Developer ID Application" "$plist"
          xcodebuild -project "$RUNNER_TEMP/safari/$APP/$APP.xcodeproj" \
            -scheme "$APP" -configuration Release archive \
            -archivePath "$RUNNER_TEMP/safari.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$RELEASE_VERSION" \
            INFOPLIST_KEY_LSApplicationCategoryType=public.app-category.developer-tools
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/safari.xcarchive" \
            -exportOptionsPlist "$plist" \
            -exportPath "$RUNNER_TEMP/safari-export"

      # A shortcut to Applications beside the app, because Safari only offers the
      # extension once its app has been moved there and opened once.
      - name: Package a disk image
        run: |
          echo "DMG=GitQuiet-$RELEASE_VERSION-safari.dmg" >> "$GITHUB_ENV"
          staging="$RUNNER_TEMP/safari-dmg"
          mkdir -p "$staging"
          cp -R "$RUNNER_TEMP/safari-export/$APP.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "$APP" -srcfolder "$staging" \
            -ov -format ULFO "GitQuiet-$RELEASE_VERSION-safari.dmg"

      # Apple has to see the image before Gatekeeper will open what is inside it,
      # and `stapler` writes that answer into the file so a reader who is offline
      # still gets it. `--wait` because the queue is minutes, not seconds.
      - name: Notarise and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$TEAM" \
            --wait
          xcrun stapler staple "$DMG"

      - uses: ./.github/actions/gatekeeper
        with:
          dmg: ${{ env.DMG }}
          app: ${{ env.APP }}.app

      # Under a fixed second name as well, for the same reason as the macOS app
      # above: the site's download link has to outlive the release it was written
      # against.
      - name: Attach the Safari app to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: |
          cp "$DMG" GitQuiet-safari.dmg
          gh release upload "$RELEASE_TAG" "$DMG" GitQuiet-safari.dmg --clobber
