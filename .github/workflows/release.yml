name: Release

on:
  release:
    types: [published]

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish extension
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit rather than the tag, because a tag can be moved to
      # point at other code, and this workflow holds the store credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # `.bun-version`, the same as `ci.yml`. On `latest` the build that ships is
      # not the build that went green, and the difference only shows after the
      # tag is published.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Set extension version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "EXTENSION_VERSION=$(bun scripts/release-version.ts "$RELEASE_TAG")" >> "$GITHUB_ENV"

      # The install above skips the `prepare` script, which is what writes
      # `.wxt/tsconfig.json` locally. Every chunk the build makes is bundled through
      # vite, and vite reads that file, so without this the first of them fails on
      # "Tsconfig not found" before `wxt build` is reached. `ci.yml` runs the same step
      # for the same reason.
      - name: Generate WXT types
        run: bun run types

      - name: Build extension
        run: bun run build

      - name: Package extension
        run: bun run zip

      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" .output/*-chrome.zip --clobber

      - name: Submit to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: bunx wxt submit --chrome-zip .output/*-chrome.zip
