name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer worthless, so it
# is cancelled rather than left to finish. `main` is exempt: its runs are the
# record of what each commit did, and a cancelled one leaves a hole in it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes. A fork's pull request gets a token that can only read,
# which is all any of these steps asks for.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The run is about ninety seconds. Ten minutes means a hang is killed rather
    # than billed for six hours.
    timeout-minutes: 10
    steps:
      # Pinned to the commit rather than the tag, because a tag can be moved to
      # point at other code and this one runs with the repository checked out.
      # Dependabot raises a pull request when either has a new release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The same bun the lockfile was written with, and the one the Railway
      # builder installs, so a green run here means the same resolution there.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      # The install takes four seconds. A dependency cache costs about the same
      # to restore and save again, so there is not one.
      #
      # The prepare script clones the Effect source for local research only,
      # so it is skipped here in favour of running wxt prepare directly.
      - run: bun install --frozen-lockfile --ignore-scripts

      # A recorded fixture carries the tokens GitHub hands a signed-in page: a
      # CSRF token per form, an HMAC per analytics click, a signed channel name,
      # an upload token, a signed URL per private image. The scrubber takes them
      # out, and this fails the run if a recording arrived with them still in.
      - name: Recordings carry no session tokens
        run: bun scripts/scrub-fixtures.ts --check

      # Written before anything is bundled, because every chunk the build makes
      # goes through vite, and vite reads the tsconfig this writes.
      - name: Generate WXT types
        run: bun run types

      # The same build the release runs, which is the only place it used to run.
      # It takes a couple of seconds and it is what puts every chunk `getURL`
      # names into `public`, so it stands in for the three chunk builds this
      # step replaced and catches a broken release at pull request time instead
      # of at the tag.
      - name: Build
        run: bun run build

      # Now the chunks are addresses. WXT types `getURL` as the set of files
      # actually in `public`, so a chunk missing above is a typecheck failure on
      # the file that imports it, and only here: a working copy has them from
      # the last `bun run build`, so the error belongs to CI alone and reads as
      # a mystery there.
      - name: Generate WXT types again
        run: bun run types

      # The build above rewrote two files that are committed: the gate
      # stylesheets a content script cannot build while a page loads, and the
      # icon table. The tests compare those files to what the table says, so
      # after a build here they cannot fail. Anything that moved is a file
      # somebody did not regenerate before committing.
      - name: The generated files under src are the committed ones
        run: git diff --exit-code -- src

      # The three gates, in one place: `package.json` holds the list, the
      # `pre-push` hook runs the same script, and `CONTRIBUTING.md` quotes it.
      # The linter answers first and the tests last, so a rule costs a second
      # rather than the whole suite.
      - name: Gates
        run: bun run gates

      # The zip the release attaches and submits, built here so a packaging
      # failure is not first seen after a tag is already published.
      - name: Package
        run: bun run zip

  # Its own job, so it answers in about fifteen seconds next to the two minutes
  # of the one above rather than after them. GitHub's push protection catches a
  # known credential on the way in; this catches everything else, and it is what
  # keeps `.gitleaksignore` honest by failing on anything not listed there.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # The checkout is the tracked tree and nothing else, which is exactly what
      # goes public. `--redact` keeps a finding out of a log anyone can read.
      - name: Scan for secrets
        run: gitleaks dir . --redact --no-banner
