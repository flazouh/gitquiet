name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer worthless, so it
# is cancelled rather than left to finish. `main` is exempt: its runs are the
# record of what each commit did, and a cancelled one leaves a hole in it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes. A fork's pull request gets a token that can only read,
# which is all any of these steps asks for.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The run is about ninety seconds. Ten minutes means a hang is killed rather
    # than billed for six hours.
    timeout-minutes: 10
    steps:
      # Pinned to the commit rather than the tag, because a tag can be moved to
      # point at other code and this one runs with the repository checked out.
      # Dependabot raises a pull request when either has a new release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The same bun the lockfile was written with, and the one the Railway
      # builder installs, so a green run here means the same resolution there.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      # The install takes four seconds. A dependency cache costs about the same
      # to restore and save again, so there is not one.
      #
      # The prepare script clones the Effect source for local research only,
      # so it is skipped here in favour of running wxt prepare directly.
      - run: bun install --frozen-lockfile --ignore-scripts

      # Written before anything is bundled, because every chunk the build makes
      # goes through vite, and vite reads the tsconfig this writes.
      - name: Generate WXT types
        run: bun run types

      # The same build the release runs, which is the only place it used to run.
      # It takes a couple of seconds and it is what puts every chunk `getURL`
      # names into `public`, so it stands in for the three chunk builds this
      # step replaced and catches a broken release at pull request time instead
      # of at the tag.
      - name: Build
        run: bun run build

      # Now the chunks are addresses. WXT types `getURL` as the set of files
      # actually in `public`, so a chunk missing above is a typecheck failure on
      # the file that imports it, and only here: a working copy has them from
      # the last `bun run build`, so the error belongs to CI alone and reads as
      # a mystery there.
      - name: Generate WXT types again
        run: bun run types

      # No try/catch anywhere, no promises in `src` outside tests, and no
      # gateway layer or extension API in the interface. `.oxlintrc.json` says
      # what each of those means and why.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run compile

      # `--parallel` runs the files across every core the runner has, which took
      # the suite from fifty seconds to fourteen locally. `--dots` keeps the log
      # to one character per test; a failure still prints its source and its
      # diff in full.
      - name: Tests
        run: bun test --parallel --dots

      # The zip the release attaches and submits, built here so a packaging
      # failure is not first seen after a tag is already published.
      - name: Package
        run: bun run zip
