name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same bun the lockfile was written with, and the one the Railway
      # builder installs, so a green run here means the same resolution there.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # The prepare script clones the Effect source for local research only,
      # so it is skipped here in favour of running wxt prepare directly.
      - run: bun install --frozen-lockfile --ignore-scripts

      # Built rather than committed, with the types written on both sides of it:
      # the build reads the tsconfig `wxt prepare` writes, and the typecheck needs
      # types written after the chunks are in `public`, since WXT types `getURL` as
      # the set of files actually there.
      - name: Generate WXT types
        run: bun run types

      # Every chunk `getURL` names, not only the engine. A chunk missing here is a
      # typecheck failure on the file that imports it, and only here: a working
      # copy has them from the last `bun run build`, so the error belongs to CI
      # alone and reads as a mystery there.
      - name: Build the chunks the shell imports by address
        run: |
          bun run build:diff-engine
          bun run build:markdown-highlighter
          bun run build:markdown-mermaid

      - name: Generate WXT types again, now the chunks are addresses
        run: bun run types

      # No try/catch anywhere, no promises in `src` outside tests, and no
      # gateway layer or extension API in the interface. `.oxlintrc.json` says
      # what each of those means and why.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run compile

      - name: Tests
        run: bun test
