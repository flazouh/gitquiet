name: Check Gatekeeper accepts a disk image
description: >
  Opens the image, verifies the signature on the app inside it and asks macOS
  whether it would run it. This is the difference between an app that opens and
  one that tells a reader it is damaged, and it is worth failing a release over.

inputs:
  dmg:
    description: Path to the disk image
    required: true
  app:
    description: Name of the app bundle inside it
    required: false
    default: GitQuiet.app

runs:
  using: composite
  steps:
    # Through `env` rather than into the script, as everything else here does it.
    # Both names hold spaces now, and an interpolated value is text the shell
    # parses: it works while the quotes fall right and stops working the day
    # somebody moves them.
    - shell: bash
      env:
        DMG: ${{ inputs.dmg }}
        APP: ${{ inputs.app }}
      run: |
        mount="$RUNNER_TEMP/gatekeeper-check"
        hdiutil attach -nobrowse -readonly "$DMG" -mountpoint "$mount"
        codesign --verify --deep --strict --verbose=2 "$mount/$APP"
        spctl --assess --type execute --verbose "$mount/$APP"
        hdiutil detach "$mount"
