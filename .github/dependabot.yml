version: 2

updates:
  # `bun` rather than `npm`, because npm would update `package.json` and leave
  # `bun.lock` alone, and CI installs with `--frozen-lockfile`. Every one of
  # those pull requests would fail before it ran a test.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Update"
    groups:
      # One pull request a week for everything routine, so the queue does not
      # fill with fifteen of them. A major goes on its own, where it can be read.
      routine:
        patterns: ["*"]
        update-types: [minor, patch]
  # `desktop` has no entry of its own. It is a workspace, so its dependencies
  # resolve into the lockfile above and are already covered. A `/desktop` entry
  # looks for a `desktop/bun.lock` that does not exist, and reports nothing
  # every Monday while reading as though the app were watched.
  #
  # There is no `ignore` for bun either. It is pinned in `.bun-version`, which
  # is not a dependency of any ecosystem, so nothing would ever be ignored.

  # The workflows pin their actions to a commit rather than a tag, because a tag
  # can be moved to point at other code. This is what tells us a new release
  # exists, since a pin cannot follow one by itself.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "Update"
    groups:
      actions:
        patterns: ["*"]
