# The gates CI runs, run before the push instead of after it.
#
# `bun install` writes these hooks, because `prepare` runs `lefthook install`
# and lefthook is a devDependency. A fresh clone is covered without anybody
# being told to run anything.
#
# `LEFTHOOK=0 git commit` and `LEFTHOOK=0 git push` go past all of it, for work
# pushed to be read rather than to be merged.

# The linter alone, over the staged files only, which answers in two tenths of a
# second. A try/catch is caught while the change is still in your head rather
# than a minute later at the push.
#
# `root` rather than a `src/**` glob, for two reasons. Lefthook's `**` does not
# match a file sitting directly in `src`, so `src/**/*.ts` silently inspects
# nothing and the hook reports success; and the linter has to stay off
# `scripts`, `desktop` and `tests`, which do not pass these rules and are not
# asked to. `root` does both, by handing over only what is under `src`.
pre-commit:
  commands:
    lint:
      root: "src/"
      glob: "*.{ts,tsx}"
      run: bunx oxlint {staged_files}

# The gates CI runs, run before the push instead of after it, so a push that
# would turn the branch red is refused here rather than on a runner a minute
# later. Nothing new is being checked; this is only the check moving to where it
# can still be acted on.
#
# `bun run gates` rather than the three commands written out again: the list
# lives in `package.json`, CI runs that same script, and the three cannot drift
# apart. It stops at the first failure, the linter answers first and the tests
# last, and `--parallel` puts them across every core.
pre-push:
  commands:
    gates:
      run: bun run gates
