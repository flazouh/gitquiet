[build]
builder = "RAILPACK"
buildCommand = "bun install --frozen-lockfile && bun run build"

[deploy]
# `serve` cannot 301 www to the apex. `site/serve.ts` does that, keeps `/welcome`
# and `/privacy` as their own files, and still 404s an address the site does not
# have rather than rewriting it to the landing page.
startCommand = "bun serve.ts"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
