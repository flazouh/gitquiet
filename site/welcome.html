<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/store/icon-128.png" />

    <title>Welcome to GitQuiet</title>
    <meta
      name="description"
      content="What GitQuiet does, in four screens: your pull requests grouped by whose move it is, one screen per pull request, and the same reading on commits, issues and checks."
    />
    <link rel="canonical" href="https://gitquiet.com/welcome" />

    <!-- The page the extension opens on install. One reader, once, arriving from a
         browser rather than from a search, so it stays out of the index. -->
    <meta name="robots" content="noindex" />
    <!--
      First paint before the bundle runs: the same bed the welcome card sits on, so the
      tab never flashes paper-white while the module loads.
    -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background:
          radial-gradient(42% 58% at 12% 22%, #9CA8A8 0%, transparent 72%),
          radial-gradient(46% 64% at 88% 18%, #90A8A8cc 0%, transparent 72%),
          radial-gradient(40% 52% at 78% 86%, #848478b3 0%, transparent 70%),
          radial-gradient(44% 56% at 18% 84%, #6C6C5499 0%, transparent 68%),
          #A8B0AE;
        color: #0E0E10;
      }
    </style>
  </head>
  <body>
    <div id="page"></div>
    <script type="module" src="/src/welcome.tsx"></script>
  </body>
</html>
