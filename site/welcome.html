<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/store/icon-128.png" />

    <title>Welcome to GitQuiet</title>
    <meta
      name="description"
      content="What GitQuiet does, in four screens: your pull requests grouped by whose move it is, one screen per pull request, and the same reading on commits, issues and checks."
    />
    <link rel="canonical" href="https://gitquiet.com/welcome" />

    <!-- The page the extension opens on install. One reader, once, arriving from a
         browser rather than from a search, so it stays out of the index. -->
    <meta name="robots" content="noindex" />
    <!--
      First paint before the bundle runs: the charcoal bed the welcome card sits on, so the
      tab never flashes paper-white while the module loads.
    -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background:
          radial-gradient(42% 58% at 8% 22%, #E53061b8 0%, transparent 72%),
          radial-gradient(46% 64% at 92% 18%, #E665B3c7 0%, transparent 72%),
          radial-gradient(36% 48% at 78% 88%, #ED494A66 0%, transparent 70%),
          radial-gradient(40% 52% at 18% 86%, #87F0BA59 0%, transparent 68%),
          radial-gradient(50% 40% at 55% 48%, #E9A86D33 0%, transparent 65%),
          #131315;
        color: #F3F4F7;
      }
    </style>
  </head>
  <body>
    <div id="page"></div>
    <script type="module" src="/src/welcome.tsx"></script>
  </body>
</html>
