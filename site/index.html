<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/store/icon-128.png" />

    <title>GitQuiet - A faster, quieter GitHub</title>
    <meta
      name="description"
      content="A faster, quieter GitHub. Pull requests that need you, filed by next action—on the session you already have. Not an AI reviewer."
    />
    <link rel="canonical" href="https://gitquiet.com/" />

    <meta property="og:title" content="GitQuiet - A faster, quieter GitHub" />
    <meta
      property="og:description"
      content="A faster, quieter GitHub. Pull requests that need you, filed by next action—on the session you already have. Not an AI reviewer."
    />
    <meta property="og:url" content="https://gitquiet.com/" />
    <meta property="og:image" content="https://gitquiet.com/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GitQuiet - A faster, quieter GitHub" />
    <meta
      name="twitter:description"
      content="A faster, quieter GitHub. Pull requests that need you, filed by next action—on the session you already have. Not an AI reviewer."
    />
    <meta name="twitter:image" content="https://gitquiet.com/og.png" />
    <!--
      First paint: sober dark field before the bundle. Crawler <main> clipped out of view.
    -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #0c0c0c;
        color: #f2f2ee;
        color-scheme: dark;
      }
      #page > main {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="page">
      <main>
        <h1>A faster, quieter GitHub.</h1>
        <p>
          Pull requests that need you, filed by next action—on the session you already have. Not an
          AI reviewer.
        </p>
        <p>
          <a href="https://chromewebstore.google.com/detail/gitquiet/ichobjnihnofjkpoegikjhefmoekaahe">Install for Chrome</a>
          <a href="/install">Install</a>
          <a href="/github-pr-inbox">GitHub PR inbox</a>
          <a href="/github-review-queue">GitHub review queue</a>
        </p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
