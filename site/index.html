<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/store/icon-128.png" />

    <title>GitQuiet - A faster, quieter GitHub</title>
    <meta
      name="description"
      content="A faster, quieter GitHub. Every pull request you're in, one screen, sorted by next action. Not an AI reviewer. No extra login."
    />
    <link rel="canonical" href="https://gitquiet.com/" />

    <meta property="og:title" content="GitQuiet - A faster, quieter GitHub" />
    <meta
      property="og:description"
      content="A faster, quieter GitHub. Every pull request you're in, one screen, sorted by next action. Not an AI reviewer. No extra login."
    />
    <meta property="og:url" content="https://gitquiet.com/" />
    <meta property="og:image" content="https://gitquiet.com/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GitQuiet - A faster, quieter GitHub" />
    <meta
      name="twitter:description"
      content="A faster, quieter GitHub. Every pull request you're in, one screen, sorted by next action. Not an AI reviewer. No extra login."
    />
    <meta name="twitter:image" content="https://gitquiet.com/og.png" />
    <!--
      First paint before the bundle runs: dark paper, crawler <main> clipped out of
      view. The bed lives inside the demo now, not behind the page.
    -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #0c0b10;
        color: #f4f2ef;
        color-scheme: dark;
      }
      #page > main {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="page">
      <!--
        The copy a crawler that never runs the bundle can still read. Indexes that skip
        JavaScript kept only /privacy, because that file is HTML and this one was an
        empty #page waiting for React. createRoot replaces this on mount; that is
        intended.
      -->
      <main>
        <h1>A faster, quieter GitHub.</h1>
        <p>A faster, quieter GitHub. Every pull request you're in, one screen, sorted by next action. Not an AI reviewer. No extra login.</p>
        <p>
          <a href="https://chromewebstore.google.com/detail/gitquiet/ichobjnihnofjkpoegikjhefmoekaahe">Add to Chrome</a>
          <a href="/install">Install</a>
        </p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
